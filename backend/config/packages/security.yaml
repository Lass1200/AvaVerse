security:
    # 1. Comment les mots de passe sont hashés en base
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # 2. Définition de la source des utilisateurs (MongoDB)
    providers:
        app_user_provider:
            mongodb:
                class: App\Document\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Zone d'authentification (gérée par LexikJWT)
        login:
            pattern: ^/api/auth/login
            stateless: true

        # Zone globale de l'API (Protégée par JWT)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # 3. Contrôle des accès (Hiérarchie et droits)
    access_control:
        # Les routes d'inscription et de génération/catalogue publiques
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/elements, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/avatar/generate, roles: PUBLIC_ACCESS, methods: [POST] }

        # Les routes d'administration (sécurisées par rôle)
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Tout le reste de l'API nécessite d'être connecté
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }